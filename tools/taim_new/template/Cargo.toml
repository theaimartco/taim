[package]
name = "{{crate}}"
version = "0.1.0"
edition = "2024"
publish = false

# A project of its own, even when created inside another workspace.
[workspace]

[lib]
# `cdylib` is what the Android package loads; `rlib` lets the desktop
# binary use the same application.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "{{crate}}"
path = "src/main.rs"

[dependencies]
taim = { {{taim_source}}, default-features = false, features = ["wgpu", "tiny-skia", "crisp", "hinting"] }
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
taim = { {{taim_source}}, default-features = false, features = ["linux-theme-detection", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
taim = { {{taim_source}}, default-features = false, features = ["android"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
