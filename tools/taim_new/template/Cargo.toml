[package]
name = "{{crate}}"
version = "0.1.0"
edition = "2024"
publish = false

# A project of its own, even when created inside another workspace.
[workspace]

[lib]
# `cdylib` is what the Android package loads; `rlib` lets the desktop
# binary use the same application.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "{{crate}}"
path = "src/main.rs"

[dependencies]
taim = { {{taim_source}}, default-features = false, features = ["wgpu", "tiny-skia", "crisp", "hinting"] }
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
taim = { {{taim_source}}, default-features = false, features = ["linux-theme-detection", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
taim = { {{taim_source}}, default-features = false, features = ["android"] }

# Fat LTO: about 13% smaller than thin LTO at the same speed.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `--size` in the macOS and iOS packagers: about 40% smaller than thin-LTO
# release. The rasterizers stay at opt-level 3, which keeps software
# rendering within about 25% of `release`; GPU rendering is unaffected.
[profile.release-small]
inherits = "release"
opt-level = "z"

[profile.release-small.package.tiny-skia]
opt-level = 3

[profile.release-small.package.tiny-skia-path]
opt-level = 3

[profile.release-small.package.taim_tiny_skia]
opt-level = 3

[profile.release-small.package.zeno]
opt-level = 3

[profile.release-small.package.swash]
opt-level = 3

[profile.release-small.package.taim_wgpu]
opt-level = 3
