[package]
name = "taim_lab"
description = "Inspector for Taim: widget tree, layout, damage, frames, GPU, semantics, animation (phase.md Phase 15)"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "taim_lab"
path = "src/main.rs"

[dependencies]
taim-profiler.workspace = true
taim.workspace = true
# A real windowed application: the same backends `taim`'s defaults enable.
taim.features = ["wgpu", "tiny-skia", "crisp", "hinting", "linux-theme-detection", "x11", "wayland"]
taim_core.workspace = true
taim_futures.workspace = true
taim_renderer.workspace = true
taim_runtime.workspace = true
taim_widget.workspace = true
