[package]
name = "aura_bench"
description = "Deterministic benchmark laboratory for the VYOM Aura fork (phase.md Phase 1)"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Enables the counting allocator used by `metrics::allocations`. Off by
# default because a global counting allocator adds overhead to every
# allocation in the process, including the harness itself; only turn it
# on for a dedicated allocation-counting run.
profiling = []

[[bin]]
name = "aura_bench"
path = "src/main.rs"

[dependencies]
aura-motion.workspace = true
aura_core.workspace = true
aura_graphics.workspace = true
aura_futures.workspace = true
# `wgpu-bare` (not just `wgpu`) is required for `aura_renderer::Renderer`
# to resolve to the `Primary`/`Secondary` fallback dispatcher instead of
# a single hard-coded backend (see `renderer/src/lib.rs`'s `#[cfg(all(
# feature = "wgpu-bare", feature = "tiny-skia"))]` gate) -- the root
# `aura` crate's own `wgpu` feature sets both `wgpu-bare` and
# `aura_renderer/wgpu` together, but at the `aura_renderer` crate level
# those are independent, so both must be requested explicitly.
#
# `x11`/`wayland` are required here even though `aura_bench` never opens a
# window: `aura_tiny_skia` always compiles its windowed `Compositor` (via
# `softbuffer`) alongside its unrelated `Headless` renderer path, and
# `softbuffer` needs at least one platform backend feature enabled to
# have any variants in its internal dispatch enums. Every other crate
# that depends on `aura_tiny_skia` (the root `aura` crate, `aura_winit`)
# already enables one of these by default; `aura_bench` must do the same
# to build at all, not to actually use windowing.
aura_renderer = { workspace = true, features = ["wgpu", "wgpu-bare", "tiny-skia", "image", "geometry", "x11", "wayland"] }
aura_runtime.workspace = true
# Needed by `scenes::effect_ladder` to quantify the real effect cost
# model (`aura_wgpu::effects`), which is where the separable/downsampled
# blur cost and texture-pool budgeting live. `aura_renderer`'s `wgpu`
# feature pulls the same crate in, but does not re-export `effects`.
aura_wgpu.workspace = true
aura_widget = { workspace = true, features = ["image", "canvas"] }

serde.workspace = true
serde.features = ["derive"]

log.workspace = true

# `executor` is needed for `futures::executor::block_on`, used once at
# startup to await `Renderer::new`'s headless backend negotiation; not
# enabled by the workspace's own `futures` entry (no other production
# crate needs synchronous blocking).
futures = { workspace = true, features = ["executor"] }

[dependencies.serde_json]
version = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Used by `metrics::memory` to read RSS from `/proc/self/status`; no
# extra dependency needed beyond `std::fs`, kept here as documentation of
# the platform assumption (see docs/performance/methodology.md).
