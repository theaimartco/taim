[package]
license.workspace = true
name = "mobile_shell"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# The workspace `taim` dependency sets `default-features = false` so the
# integration suite can control its own feature matrix (see the comment at
# `[workspace.dependencies]`). An example therefore has to opt back in, and
# this list is deliberately what `taim`'s own `default` feature enables --
# `scripts/ci/check-budgets.sh` measures this binary as "what a real app
# costs to ship", so it must be built the way a real app would be.
#
# `fira-sans` is deliberately absent, matching `taim`'s `default` feature
# (Pillar XIII of future.md): a real app does not pay ~430 KiB for a bundled
# font it can get from the host/OS. An app that needs the bundled font for
# pixel-identical rendering across machines opts back in explicitly.
taim.workspace = true
taim.features = ["wgpu", "tiny-skia", "crisp", "hinting"]

[target.'cfg(not(target_os = "android"))'.dependencies]
taim = { workspace = true, features = ["linux-theme-detection", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
taim = { workspace = true, features = ["android"] }
log.workspace = true

[lib]
# `cdylib` is the shared library an Android package loads; `rlib` lets the
# desktop binary below use the same application.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mobile_shell"
path = "src/main.rs"

# For `cargo apk build -p mobile_shell` (cargo-apk) builds; Gradle builds
# use the manifest in `android/` instead. See docs/platform/android.md.
[package.metadata.android]
package = "com.theaimartco.taim.mobileshell"
apk_name = "mobile_shell"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Taim Mobile Shell"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
orientation = "unspecified"
