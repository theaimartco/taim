[package]
name = "mobile_shell"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# The workspace `taim` dependency sets `default-features = false` so the
# integration suite can control its own feature matrix (see the comment at
# `[workspace.dependencies]`). An example therefore has to opt back in, and
# this list is deliberately what `taim`'s own `default` feature enables --
# `scripts/ci/check-budgets.sh` measures this binary as "what a real app
# costs to ship", so it must be built the way a real app would be.
#
# `fira-sans` is deliberately absent, matching `taim`'s `default` feature
# (Pillar XIII of future.md): a real app does not pay ~430 KiB for a bundled
# font it can get from the host/OS. An app that needs the bundled font for
# pixel-identical rendering across machines opts back in explicitly.
taim.workspace = true
taim.features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "hinting",
    "linux-theme-detection",
    "x11",
    "wayland",
]
