[package]
name = "aura_renderer"
description = "The official renderer for aura"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
wgpu = ["aura_wgpu/default"]
wgpu-bare = ["aura_wgpu"]
tiny-skia = ["aura_tiny_skia"]
image = ["aura_tiny_skia?/image", "aura_wgpu?/image"]
svg = ["aura_tiny_skia?/svg", "aura_wgpu?/svg"]
svg-text = ["aura_tiny_skia?/svg-text", "aura_wgpu?/svg-text"]
svg-raster-images = ["aura_tiny_skia?/svg-raster-images", "aura_wgpu?/svg-raster-images"]
geometry = ["aura_graphics/geometry", "aura_tiny_skia?/geometry", "aura_wgpu?/geometry"]
web-colors = ["aura_wgpu?/web-colors"]
webgl = ["aura_wgpu?/webgl"]
fira-sans = ["aura_graphics/fira-sans"]
strict-assertions = ["aura_wgpu?/strict-assertions"]
x11 = ["aura_tiny_skia?/x11"]
wayland = ["aura_tiny_skia?/wayland"]

[dependencies]
aura_graphics.workspace = true

aura_tiny_skia.workspace = true
aura_tiny_skia.optional = true

aura_wgpu.workspace = true
aura_wgpu.optional = true

log.workspace = true
thiserror.workspace = true
