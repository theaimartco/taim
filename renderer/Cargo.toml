[package]
name = "taim_renderer"
description = "The official renderer for taim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
wgpu = ["taim_wgpu/default"]
wgpu-bare = ["taim_wgpu"]
tiny-skia = ["taim_tiny_skia"]
image = ["taim_tiny_skia?/image", "taim_wgpu?/image"]
svg = ["taim_tiny_skia?/svg", "taim_wgpu?/svg"]
svg-text = ["taim_tiny_skia?/svg-text", "taim_wgpu?/svg-text"]
svg-raster-images = ["taim_tiny_skia?/svg-raster-images", "taim_wgpu?/svg-raster-images"]
geometry = ["taim_graphics/geometry", "taim_tiny_skia?/geometry", "taim_wgpu?/geometry"]
web-colors = ["taim_wgpu?/web-colors"]
webgl = ["taim_wgpu?/webgl"]
fira-sans = ["taim_graphics/fira-sans"]
strict-assertions = ["taim_wgpu?/strict-assertions"]
raster = ["taim_graphics/raster", "taim_wgpu?/raster"]
x11 = ["taim_tiny_skia?/x11"]
wayland = ["taim_tiny_skia?/wayland"]

[dependencies]
taim_graphics.workspace = true

taim_tiny_skia.workspace = true
taim_tiny_skia.optional = true

taim_wgpu.workspace = true
taim_wgpu.optional = true

log.workspace = true
