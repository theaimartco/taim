[package]
name = "taim_winit"
description = "The TAIM desktop shell, on top of winit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["x11", "wayland"]
debug = []
# Opt-in first-successful-present marker for the external application harness.
measurement = []
hinting = []
linux-theme-detection = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
image = ["taim_core/image", "arboard/image-data"]
# Connects the retained semantic tree to the platform's assistive technology
# over AT-SPI. Off by default because it pulls in zbus and an async runtime,
# which an embedder that supplies its own accessibility layer should not have
# to carry. See taim-accessibility/src/atspi/bridge.rs.
accessibility = ["taim-accessibility/atspi"]
x11 = ["winit/x11"]
# Android, through NativeActivity: no Java code is needed in the
# application package. GameActivity (AndroidX) handles more of the
# platform's input, including text input from the on-screen keyboard.
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita", "arboard/wayland-data-control"]

[dependencies]
taim_core.workspace = true
taim_debug.workspace = true
taim_graphics.workspace = true
taim_renderer.workspace = true
taim-accessibility.workspace = true
taim-view.workspace = true

futures.workspace = true
futures.features = ["executor"]

log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true


[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"
# TalkBack: the semantic tree, published through AccessKit. The embedded
# dex carries the small Java delegate it injects, so an application needs
# no Java code of its own.
accesskit = "0.25"
accesskit_android = { version = "0.9.1", features = ["embedded-dex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.features = ["Document", "Window", "HtmlCanvasElement"]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mundy.workspace = true
mundy.optional = true

# Delete once we update to `winit 0.31`
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }

[dev-dependencies]
# The TalkBack tree conversion is tested on every platform.
accesskit = "0.25"
