[package]
name = "taim_winit"
description = "The TAIM desktop shell, on top of winit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["x11", "wayland"]
debug = []
# Opt-in first-successful-present marker for the external application harness.
measurement = []
hinting = []
linux-theme-detection = ["dep:zbus"]
image = ["taim_core/image", "arboard/image-data"]
# Connects the retained semantic tree to the platform's assistive technology
# over AT-SPI. Off by default because it pulls in zbus and an async runtime,
# which an embedder that supplies its own accessibility layer should not have
# to carry. See taim-accessibility/src/atspi/bridge.rs.
accessibility = ["taim-accessibility/atspi"]
x11 = ["winit/x11"]
# Android, through NativeActivity: no Java code is needed in the
# application package. GameActivity (AndroidX) handles more of the
# platform's input, including text input from the on-screen keyboard.
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita", "arboard/wayland-data-control"]

[dependencies]
serde_json = "1.0"
serde = { workspace = true, features = ["derive"] }
base64 = "0.22"
taim_core.workspace = true
taim_debug.workspace = true
taim_graphics.workspace = true
taim_renderer.workspace = true
taim-accessibility.workspace = true
taim-view.workspace = true

futures.workspace = true
futures.features = ["executor"]

log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true


# arboard covers Linux, Windows and macOS; mobile platforms have their own.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
arboard.workspace = true

# iOS services: links, the pasteboard. The same versions winit uses.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSDictionary", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.2.2", features = ["UIApplication", "UIPasteboard", "UIResponder", "block2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.features = ["Clipboard", "console", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Navigator", "Node", "ShareData", "Storage", "Window"]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
zbus.optional = true

# Delete once we update to `winit 0.31`
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }
# platform.rs (open_url/share/vibrate/data_dir) is written against the jni 0.21 API.
jni21 = { package = "jni", version = "0.21" }
ndk-context = "0.1"
