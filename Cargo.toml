[package]
name = "taim"
description = "A cross-platform GUI library inspired by Elm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
# `fira-sans` is default so an Taim application renders identically on every
# machine. Without it text falls back to whatever the host happens to have
# installed, which is not a look a framework can claim to control. Costs
# ~430 KiB in the binary; see scripts/ci/check-budgets.sh.
#
# `web-colors` is deliberately NOT here. It was, and it made the shipping
# renderer blend gamma-encoded components -- its own description below calls
# that "broken". Linear-light compositing is the production default, and the
# Web-compatibility behaviour is an explicit opt-in. See
# `docs/architecture/color-pipeline.md` and `tests/color/contract.rs`.
default = ["wgpu", "tiny-skia", "crisp", "hinting", "thread-pool", "linux-theme-detection", "x11", "wayland", "fira-sans"]
# Enables the `wgpu` GPU-accelerated renderer with all its default features (Vulkan, Metal, DX12, OpenGL, and WebGPU)
wgpu = ["wgpu-bare", "taim_renderer/wgpu"]
# Enables the `wgpu` GPU-accelerated renderer with the minimum required features (no backends!)
wgpu-bare = ["taim_renderer/wgpu-bare", "taim_widget/wgpu"]
# Enables the `tiny-skia` software renderer
tiny-skia = ["taim_renderer/tiny-skia"]
# Enables the `image` widget and image clipboard support
image = ["image-without-codecs", "image/default", "taim_winit/image"]
# Enables the `image` widget, without any built-in codecs of the `image` crate
image-without-codecs = ["taim_widget/image", "dep:image"]
# Enables the `svg` widget
svg = ["taim_widget/svg"]
# Enables the `canvas` widget
canvas = ["taim_widget/canvas"]
# Enables the `qr_code` widget
qr_code = ["taim_widget/qr_code"]
# Enables the `markdown` widget
markdown = ["taim_widget/markdown"]
# Makes `taim_design::Theme` usable as the theme for every widget with an
# Taim counterpart, so real controls render from Taim's semantic tokens
# (see docs/design/taim-language.md). Depend on `taim-design` directly to
# name the theme type.
taim = ["taim_widget/taim"]
# Enables lazy widgets
lazy = ["taim_widget/lazy"]
# Enables hot reloading (very experimental!)
hot = ["taim_debug/hot"]
# Enables the `thread-pool` futures executor as the `executor::Default` on native platforms
thread-pool = ["taim_futures/thread-pool"]
# Enables `tokio` as the `executor::Default` on native platforms
tokio = ["taim_futures/tokio"]
# Enables `smol` as the `executor::Default` on native platforms
smol = ["taim_futures/smol"]
# Enables querying system information
sysinfo = ["taim_winit/sysinfo"]
# Legacy compatibility: blends in gamma space, reproducing the Web's colour
# management. Opt-in only.
#
# This is not a performance or precision trade -- it is mathematically the
# wrong operation, and it changes every translucent surface, antialiased glyph
# edge, and soft shadow in the framework. It exists for callers who must match
# a browser's output exactly. Enabling it disables
# `taim_graphics::color::GAMMA_CORRECTION` and makes
# `taim_core::renderer::Quad::luminance` inert, because there is no linear
# light in the pipeline for a luminance multiplier to scale.
web-colors = ["taim_renderer/web-colors"]
# Enables pixel snapping for crisp edges by default (can cause jitter!)
crisp = ["taim_core/crisp"]
# Enables the WebGL backend
webgl = ["taim_renderer/webgl"]
# Enables syntax highlighting for the `markdown` widget and the
# `text_editor` widget, via the dependency-free `taim-highlighter` crate
highlighter = ["dep:taim-highlighter", "taim_widget/highlighter"]
# Enables the advanced module
advanced = ["taim_core/advanced", "taim_widget/advanced"]
# Embeds Fira Sans into the final application; useful for testing and Wasm builds
fira-sans = ["taim_renderer/fira-sans"]
# Enables basic text shaping by default
basic-shaping = ["taim_core/basic-shaping"]
# Enables advanced text shaping by default
advanced-shaping = ["taim_core/advanced-shaping"]
# Enables rendering hints (e.g. metrics hinting)
hinting = ["taim_winit/hinting"]
# Enables strict assertions for debugging purposes at the expense of performance
strict-assertions = ["taim_renderer/strict-assertions"]
# Redraws on every runtime event, and not only when a widget requests it
unconditional-rendering = ["taim_winit/unconditional-rendering"]
# Enables support for the `sipper` library
sipper = ["taim_runtime/sipper"]
# Enables Linux system theme detection
linux-theme-detection = ["taim_winit/linux-theme-detection"]
# Enables the Unix X11 backend
x11 = ["taim_renderer/x11", "taim_winit/x11"]
# Enables the Unix Wayland backend
wayland = ["taim_renderer/wayland", "taim_winit/wayland"]
# Enables the VYOM platform backend
vyom = ["dep:taim-platform-vyom"]
# Delivers the semantic tree to assistive technology over AT-SPI.
#
# Taim builds a retained semantic tree every frame regardless; this is what
# carries it to a screen reader. Without it the tree is diffed, translated,
# and pushed into an in-memory queue nothing drains -- which is what the
# framework did for its whole existence (Capstone.md F-15).
accessibility = ["taim_winit/accessibility"]

[dependencies]
taim_debug.workspace = true
taim_core.workspace = true
taim_futures.workspace = true
taim_renderer.workspace = true
taim_runtime.workspace = true
taim_widget.workspace = true
taim_winit.workspace = true

taim-highlighter.workspace = true
taim-highlighter.optional = true

taim-platform-vyom.workspace = true
taim-platform-vyom.optional = true

thiserror.workspace = true

image.workspace = true
image.optional = true

[dev-dependencies]
taim-accessibility.workspace = true
taim-design.workspace = true
taim-gesture.workspace = true
taim-profiler.workspace = true
taim-motion.workspace = true
taim-platform-vyom.workspace = true
criterion = "0.5"
taim_wgpu.workspace = true
taim_renderer.workspace = true
taim_graphics.workspace = true
# The CPU backend, so `tests/color/output.rs` can assert what reaches a
# presentation target on a machine with no GPU.
taim_tiny_skia.workspace = true

# `default-features = false` is load-bearing, not tidiness. Without it this
# edge re-enabled the `taim` crate's whole default set inside every
# integration test, so `cargo test --no-default-features` was a no-op and
# `web-colors` was silently on in every configuration -- which is why the
# framework blended in gamma space for its entire history with 1,800 tests
# passing. `tests/color/contract.rs` now fails if that recurs.
#
# Features are listed explicitly. Adding one here changes what every
# integration test exercises, so it should be a deliberate act.
taim.workspace = true
taim.features = [
    "advanced",
    "taim",
    "wgpu",
    "tiny-skia",
    "crisp",
    "hinting",
    "thread-pool",
    "fira-sans",
    "linux-theme-detection",
    "x11",
    "wayland",
]

# Used by tests/bench/report_schema.rs to parse taim_bench's JSON report
# output as a black box (taim_bench is a bin-only crate, so its own
# `Report` type is not otherwise reachable from this directory).
serde_json = "1.0"

[[bench]]
name = "wgpu"
harness = false
required-features = ["canvas"]

[[bench]]
name = "cpu"
harness = false
required-features = ["canvas"]

[profile.release-opt]
inherits = "release"
codegen-units = 1
debug = false
lto = true
incremental = false
opt-level = 3
overflow-checks = false
strip = "symbols"

[workspace]
members = [
    "taim-accessibility",
    "taim-design",
    "taim-gesture",
    "taim-highlighter",
    "taim-motion",
    "taim-platform-vyom",
    "taim-profiler",
    "taim-showcase",
    "core",
    "debug",
    "examples/mobile_shell",
    "futures",
    "graphics",
    "program",
    "renderer",
    "runtime",
    "tiny_skia",
    "tools/taim_bench",
    "tools/taim_lab",
    "wgpu",
    "widget",
    "winit",
]

[workspace.package]
version = "0.15.0-dev"
authors = [
    "VYOM Taim contributors",
    # Taim is a fork of `iced`; the upstream architecture and a large part
    # of the widget/renderer code originate there. See CREDITS.md.
    "Héctor Ramón Jiménez <hector@hecrj.dev>",
]
edition = "2024"
license = "MIT"
repository = "https://github.com/theaimartco/taim"
homepage = "https://github.com/theaimartco/taim"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "vyom", "wayland"]
rust-version = "1.92"

[workspace.dependencies]
zbus = "5.17"
taim-accessibility = { version = "0.15.0-dev", path = "taim-accessibility" }
taim-design = { version = "0.15.0-dev", path = "taim-design" }
taim-gesture = { version = "0.15.0-dev", path = "taim-gesture" }
taim-highlighter = { version = "0.15.0-dev", path = "taim-highlighter" }
taim-motion = { version = "0.15.0-dev", path = "taim-motion", default-features = false }
taim-platform-vyom = { version = "0.15.0-dev", path = "taim-platform-vyom" }
taim-profiler = { version = "0.15.0-dev", path = "taim-profiler" }
# `default-features = false` here rather than at the dev-dependency, because
# Cargo forbids an inherited dependency from overriding it. See the
# dev-dependencies section for why it matters.
taim = { version = "0.15.0-dev", path = ".", default-features = false }
taim_core = { version = "0.15.0-dev", path = "core" }
taim_debug = { version = "0.15.0-dev", path = "debug" }
taim_futures = { version = "0.15.0-dev", path = "futures" }
taim_graphics = { version = "0.15.0-dev", path = "graphics" }
taim_program = { version = "0.15.0-dev", path = "program" }
taim_renderer = { version = "0.15.0-dev", path = "renderer" }
taim_runtime = { version = "0.15.0-dev", path = "runtime" }
taim_tiny_skia = { version = "0.15.0-dev", path = "tiny_skia", default-features = false }
taim_wgpu = { version = "0.15.0-dev", path = "wgpu", default-features = false }
taim_widget = { version = "0.15.0-dev", path = "widget" }
taim_winit = { version = "0.15.0-dev", path = "winit", default-features = false }

arboard = { version = "3.6", default-features = false }
bincode = "1.3"
bitflags = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
bytes = "1.6"
cargo-hot = { version = "0.1", package = "cargo-hot-protocol" }
cosmic-text = "0.19"
cryoglyph = { git = "https://github.com/iced-rs/cryoglyph.git", rev = "53ba3e879539d19ed8162942126a977ec896cc3b" }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
glam = "0.33.2"
guillotiere = "0.6"
half = "2.2"
image = { version = "0.25", default-features = false }
kamadak-exif = "0.6"
kurbo = "0.10"
lilt = "0.8"
log = "0.4"
lyon = "1.0"
lyon_path = "1.0"
mundy = { version = "0.2", default-features = false }
nom = "8"
num-traits = "0.2"
ouroboros = "0.18"
png = "0.18"
pulldown-cmark = "0.12"
qrcode = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
rfd = "0.16"
rustc-hash = "2.0"
semver = "1.0"
serde = "1.0"
sha2 = "0.10"
sipper = "0.1"
smol = "2"
smallvec = { version = "1.13", features = ["union"] }
smol_str = "0.2"
softbuffer = { version = "0.4", default-features = false }
sysinfo = "0.33"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = "1.0"
tracing = "0.1"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
unicode-segmentation = "1.0"
url = "2.5"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4.2"
web-sys = "=0.3.85"
web-time = "1.1"
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
winit = { git = "https://github.com/iced-rs/winit.git", rev = "05b8ff17a06562f0a10bb46e6eaacbe2a95cb5ed", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"
unused_results = "deny"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
manual_filter = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
