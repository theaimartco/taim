[package]
name = "aura-accessibility"
description = "Retained, incremental semantic engine and platform adapters for Aura"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = []
# The AT-SPI2 bridge's D-Bus transport. Off by default: the vocabulary
# and store are pure and useful without a bus, and zbus pulls in an async
# runtime that a caller embedding Aura elsewhere should not have to carry.
atspi = ["dep:zbus", "dep:log"]

[dependencies]
bitflags.workspace = true
aura_core.workspace = true
rustc-hash.workspace = true
smol_str.workspace = true
zbus = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
serde = "1"
# `tests/atspi_bus.rs` drives the transport the way a screen reader does:
# from outside the crate, over a real bus. That needs its own handle on
# both the vocabulary it asserts against and the bus it asserts over,
# because an integration test does not inherit the library's dependencies.
aura_core.workspace = true
zbus.workspace = true
