# TAIM local verification is explicitly available even while GitHub Actions
# workflow YAML remains commented out at the repository owner's request.
[alias]
lint = "clippy --workspace --benches --all-features --no-deps -- -D warnings"
lint-fix = "clippy --fix --allow-dirty --workspace --benches --all-features --no-deps -- -D warnings"
taim-check = "check --workspace --all-targets --locked"
taim-test = "test --workspace --all-features --locked"
taim-lint = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
