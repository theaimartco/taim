[package]
name = "taim_widget"
description = "The built-in widgets for taim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
# Makes `taim_design::Theme` a first-class taim theme: every widget with
# an Taim counterpart resolves its style from Taim's semantic tokens
# instead of taim's built-in palette. Off by default so an application
# that only wants upstream taim does not pay for the design system.
taim = ["dep:taim-design"]
lazy = ["ouroboros"]
image = ["taim_renderer/image"]
svg = ["taim_renderer/svg"]
canvas = ["taim_renderer/geometry"]
qr_code = ["canvas", "dep:qrcode"]
wgpu = ["taim_renderer/wgpu-bare"]
markdown = ["dep:pulldown-cmark"]
advanced = []
# Enables syntax highlighting of fenced code blocks in the `markdown`
# widget, and the `taim-highlighter` adapter for `text_editor`.
highlighter = ["dep:taim-highlighter"]
signal = ["lazy", "dep:taim-signal"]

[dependencies]
taim-design = { workspace = true, optional = true }
taim-highlighter = { workspace = true, optional = true }
taim-motion.workspace = true
taim_renderer.workspace = true
taim_runtime.workspace = true
taim-signal = { workspace = true, optional = true }

num-traits.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

ouroboros.workspace = true
ouroboros.optional = true

qrcode.workspace = true
qrcode.optional = true

pulldown-cmark.workspace = true
pulldown-cmark.optional = true
