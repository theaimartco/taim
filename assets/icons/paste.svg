<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-paste d-paste">
<title id="t-paste">TAIM Paste</title><desc id="d-paste">Original premium paste vector, layered graphite, polished steel and crimson enamel.</desc>
<defs>
<linearGradient id="graphite" x1="0" y1="0" x2=".92" y2="1"><stop stop-color="#656c7a"/><stop offset=".18" stop-color="#343946"/><stop offset=".45" stop-color="#181b24"/><stop offset=".73" stop-color="#0b0d15"/><stop offset="1" stop-color="#05070b"/></linearGradient>
<linearGradient id="steel" x1=".12" y1="0" x2=".89" y2="1"><stop stop-color="#fafcff"/><stop offset=".22" stop-color="#a1a7b4"/><stop offset=".53" stop-color="#2c303a"/><stop offset=".78" stop-color="#c6ccd7"/><stop offset="1" stop-color="#3b3e4a"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbdba"/><stop offset=".22" stop-color="#ff4157"/><stop offset=".53" stop-color="#df0e31"/><stop offset=".79" stop-color="#a10623"/><stop offset="1" stop-color="#520419"/></linearGradient>
<radialGradient id="garnet" cx=".3" cy=".2" r=".9"><stop stop-color="#ffabad"/><stop offset=".3" stop-color="#fa2443"/><stop offset=".73" stop-color="#9d0624"/><stop offset="1" stop-color="#340410"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".6" stop-color="#f3cbd4" stop-opacity=".44"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.25" stdDeviation="1.4" flood-color="#000105" flood-opacity=".58"/></filter></defs>
<style>.body{fill:url(#graphite);stroke:url(#steel);stroke-width:1.4;filter:url(#shadow)}.raised{fill:url(#garnet);stroke:url(#steel);stroke-width:1.4}.enamel{fill:none;stroke:url(#red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.glint{fill:none;stroke:url(#shine);stroke-width:1.3;stroke-linecap:round}.gem{fill:url(#garnet);stroke:url(#steel);stroke-width:1.25}</style>
<g stroke-linejoin="round" stroke-linecap="round"><rect class="body" x="8" y="12" width="44" height="44" rx="6"/><rect class="body" x="19" y="7" width="21" height="11" rx="4"/><path class="body" d="M25 25 H47 L55 33 V55 H25 Z"/><path class="raised" d="M46 25 V34 H55 Z"/><path class="enamel" d="M40 37 V48 M34 43 40 49 46 43"/><path class="glint" d="M13 22 V49 M21 14 H37"/></g></svg>
