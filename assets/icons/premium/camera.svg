<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-camera d-camera">
<title id="t-camera">TAIM Camera</title><desc id="d-camera">Premium original vector symbol for Camera, with crimson enamel and brushed-metal depth.</desc>
<defs><linearGradient id="graphite" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#545b69"/><stop offset=".21" stop-color="#292d38"/><stop offset=".62" stop-color="#11151d"/><stop offset="1" stop-color="#06080e"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f0f4fc"/><stop offset=".2" stop-color="#878e9e"/><stop offset=".6" stop-color="#343844"/><stop offset=".84" stop-color="#aab2bf"/><stop offset="1" stop-color="#272c36"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9ba0"/><stop offset=".28" stop-color="#fa243f"/><stop offset=".68" stop-color="#a80724"/><stop offset="1" stop-color="#4d0518"/></linearGradient>
<radialGradient id="garnet" cx=".35" cy=".21"><stop stop-color="#ff9a9a"/><stop offset=".28" stop-color="#ee203f"/><stop offset=".76" stop-color="#89051c"/><stop offset="1" stop-color="#320711"/></radialGradient>
