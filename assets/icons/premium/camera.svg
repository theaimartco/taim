<style>.body{fill:url(#graphite);stroke:url(#steel);stroke-width:1.55;filter:url(#shadow)}.enamel{fill:none;stroke:url(#red);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.glint{fill:none;stroke:url(#shine);stroke-width:1.4;stroke-linecap:round}.gem{fill:url(#garnet);stroke:url(#steel);stroke-width:1.15}.void{fill:#07090f;stroke:url(#red);stroke-width:2}</style>
