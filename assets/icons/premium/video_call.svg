<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-video_call d-video_call"><title id="t-video_call">TAIM Video Call</title><desc id="d-video_call">Original premium TAIM video call SVG, graphite alloy, silver contour and crimson luminous detail.</desc><defs><linearGradient id="shell" x1="0" y1="0" x2=".92" y2="1"><stop stop-color="#737d8f"/><stop offset=".23" stop-color="#303744"/><stop offset=".59" stop-color="#11151e"/><stop offset="1" stop-color="#070910"/></linearGradient><linearGradient id="metal" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#f8fbff"/><stop offset=".18" stop-color="#9ca4b3"/><stop offset=".48" stop-color="#232938"/><stop offset=".8" stop-color="#cad1db"/><stop offset="1" stop-color="#404957"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbbb5"/><stop offset=".28" stop-color="#ff4258"/><stop offset=".7" stop-color="#ac071f"/><stop offset="1" stop-color="#480411"/></linearGradient><radialGradient id="garnet"><stop stop-color="#ff8589"/><stop offset=".4" stop-color="#f12643"/><stop offset="1" stop-color="#730515"/></radialGradient><linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".86"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient><filter id="depth" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#030408" flood-opacity=".58"/></filter></defs><style>.body{fill:url(#shell);stroke:url(#metal);stroke-width:1.6;stroke-linejoin:round;filter:url(#depth)}.ruby{fill:url(#garnet);stroke:url(#metal);stroke-width:1.5}.trace{fill:none;stroke:url(#red);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.shine{fill:none;stroke:url(#highlight);stroke-width:1.4;stroke-linecap:round}</style><g stroke-linejoin="round" stroke-linecap="round"><rect class="body" x="6" y="14" width="39" height="37" rx="8"/><path class="body" d="M45 24 57 16 Q60 14 60 20 V45 Q60 49 56 46 L45 38 Z"/><circle class="ruby" cx="25" cy="29" r="8"/><path class="trace" d="M16 43 Q25 33 34 43 M48 27 56 23"/><path class="shine" d="M11 19 H39"/></g></svg>
