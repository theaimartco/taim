<title id="t-database">TAIM Database</title><desc id="d-database">Premium original vector symbol for Database, with crimson enamel and brushed-metal depth.</desc>
<defs><linearGradient id="graphite" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#545b69"/><stop offset=".21" stop-color="#292d38"/><stop offset=".62" stop-color="#11151d"/><stop offset="1" stop-color="#06080e"/></linearGradient>
