[package]
license.workspace = true
name = "taim-showcase"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# See `examples/mobile_shell/Cargo.toml`: the workspace `taim` dependency
# disables default features, so every binary has to name what it needs.
taim.workspace = true
taim.features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "hinting",
    "linux-theme-detection",
    "x11",
    "wayland",
    "fira-sans",
    "image-without-codecs",
    "svg",
]

[dev-dependencies]
# `tests/headless_semantics.rs` runs the showcase's view tree on its own
# root with a headless CPU renderer, so it needs the core vocabulary and the
# accessibility tree straight from their crates.
taim_core.workspace = true
taim-accessibility.workspace = true
futures.workspace = true
