[package]
name = "taim_wgpu"
description = "A renderer for taim on top of wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["wgpu/default"]
geometry = ["taim_graphics/geometry", "lyon"]
image = ["taim_graphics/image", "dep:image"]
svg = ["taim_graphics/svg", "resvg"]
svg-text = ["svg", "resvg/text", "resvg/system-fonts", "resvg/memmap-fonts"]
svg-raster-images = ["svg", "resvg/raster-images"]
web-colors = ["taim_graphics/web-colors"]
webgl = ["wgpu/webgl"]
strict-assertions = []
profiling = []
raster = ["taim_graphics/raster", "dep:taim-raster"]

[dependencies]
taim_debug.workspace = true
taim_graphics.workspace = true
taim-raster = { workspace = true, optional = true }
taim_atlas.workspace = true
taim_text_gpu.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
futures.workspace = true
log.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
thiserror.workspace = true
wgpu.workspace = true

lyon.workspace = true
lyon.optional = true

resvg.workspace = true
resvg.optional = true

image.workspace = true
image.optional = true
