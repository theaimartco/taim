[package]
name = "aura_wgpu"
description = "A renderer for aura on top of wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["wgpu/default"]
geometry = ["aura_graphics/geometry", "lyon"]
image = ["aura_graphics/image", "guillotiere", "dep:image"]
svg = ["aura_graphics/svg", "resvg", "guillotiere"]
svg-text = ["svg", "resvg/text", "resvg/system-fonts", "resvg/memmap-fonts"]
svg-raster-images = ["svg", "resvg/raster-images"]
web-colors = ["aura_graphics/web-colors"]
webgl = ["wgpu/webgl"]
strict-assertions = []
profiling = []

[dependencies]
aura_debug.workspace = true
aura_graphics.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
futures.workspace = true
cryoglyph.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
wgpu.workspace = true

lyon.workspace = true
lyon.optional = true

guillotiere.workspace = true
guillotiere.optional = true

resvg.workspace = true
resvg.optional = true

image.workspace = true
image.optional = true

