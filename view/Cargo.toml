[package]
name = "taim-view"
description = "The TAIM view contract: signal-driven views without message types"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
image = ["taim_renderer/image"]
svg = ["taim_renderer/svg"]

[dependencies]
thiserror.workspace = true
taim_core.workspace = true
taim_renderer.workspace = true
taim-signal.workspace = true
unicode-segmentation.workspace = true
futures = { workspace = true, features = ["executor"] }
log.workspace = true

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
