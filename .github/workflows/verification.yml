name: TAIM release verification
on:
  pull_request:
    branches: [main, hardening/wayland-bench-release-gates-20261019]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: taim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Measurement and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run measurement harness unit tests
        run: python3 -m unittest discover -s scripts/perf -p 'test_*.py' -v
      - name: Verify fail-closed release evidence contracts
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Validate hardware and benchmark entrypoint syntax
        run: |
          bash -n scripts/qa/wayland-smoke.sh
          bash -n scripts/perf/compare-frameworks.sh
      - name: Audit upstream dependency boundary
        run: |
          python3 -m unittest discover -s scripts/audit -p 'test_*.py' -v
          python3 scripts/audit/check-upstream-boundary.py
      - name: Check release requirements
        run: |
          test -s SECURITY.md
          test -s docs/testing/wayland-vyom-device-acceptance.md
          test -s docs/performance/four-framework-comparison.md
          test -s docs/release/production-gates.md
          test -s scripts/release/verify-readiness.py
          test -s scripts/perf/compare-evidence.py

  formatting:
    name: Rust formatting gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned formatter
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
      - name: Verify rustfmt (nonconformance blocks release)
        run: cargo fmt --all -- --check

  supply_chain:
    name: Dependency advisories, licenses and source provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Nightly fuzz regression (not a GPU test)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Exercise 4 fuzz targets
        run: |
          cargo +nightly fuzz run damage_region -- -max_total_time=60
          cargo +nightly fuzz run pointer_stream -- -max_total_time=60
          cargo +nightly fuzz run text_edit -- -max_total_time=60
          cargo +nightly fuzz run layout_tree -- -max_total_time=60

  rust:
    name: Rust checks, golden images, accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install native build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev dbus dbus-x11
      - name: Check workspace
        run: bash scripts/ci/check-workspace.sh
      - name: Check and lint
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Visual goldens
        run: cargo test --test golden
      - name: Accessibility D-Bus integration
        env:
          TAIM_ATSPI_REQUIRE_BUS: "1"
        run: dbus-run-session -- cargo test -p taim-accessibility --features atspi --test atspi_bus
      - name: Enforce dependency, binary-size and unsafe-code budgets
        run: bash scripts/ci/check-budgets.sh
      - name: Package inventory (does not publish)
        run: cargo package -p taim --list --allow-dirty
      - name: Independent external Cargo consumer compile
        run: bash scripts/release/external-consumer-smoke.sh

# Hosted CI cannot establish real-device presentation or physical latency.
