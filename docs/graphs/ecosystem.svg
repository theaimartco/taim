<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">TAIM ecosystem</title>
  <desc id="desc">TAIM framework layers from application API through widgets, runtime, renderers, and platforms</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#08111F"/><stop offset="1" stop-color="#111C35"/></linearGradient>
    <linearGradient id="accent" x1="190" y1="0" x2="910" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#6F86A8"/></marker>
  </defs>
  <rect width="1100" height="760" rx="30" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="550" y="62" fill="#F8FAFC" font-size="28" font-weight="760">TAIM ecosystem</text><text x="550" y="92" fill="#94A3B8" font-size="15">Performance-first UI from state to pixels.</text>
    <rect x="390" y="122" width="320" height="62" rx="20" fill="url(#accent)"/><text x="550" y="161" fill="#FFFFFF" font-size="20" font-weight="750">application API</text>
    <path d="M550 184v24H245v22M550 208v22M550 208h305v22" fill="none" stroke="#6F86A8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="110" y="230" width="270" height="76" rx="20" fill="#13283A" stroke="#22D3EE" stroke-width="2"/><text x="245" y="264" fill="#E2E8F0" font-size="19" font-weight="700">widgets + design</text><text x="245" y="287" fill="#94A3B8" font-size="14">adaptive · accessible · motion</text>
    <rect x="415" y="230" width="270" height="76" rx="20" fill="#15233D" stroke="#3B82F6" stroke-width="2"/><text x="550" y="264" fill="#E2E8F0" font-size="19" font-weight="700">runtime</text><text x="550" y="287" fill="#94A3B8" font-size="14">signals · scheduler · semantics</text>
    <rect x="720" y="230" width="270" height="76" rx="20" fill="#261C47" stroke="#8B5CF6" stroke-width="2"/><text x="855" y="264" fill="#E2E8F0" font-size="19" font-weight="700">developer systems</text><text x="855" y="287" fill="#94A3B8" font-size="14">debug · profiler · diagnostics</text>
    <path d="M245 306v46h610M550 306v46M855 306v46M550 352v34" fill="none" stroke="#6F86A8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="250" y="392" width="600" height="72" rx="20" fill="#15233D" stroke="#4A648A" stroke-width="2"/><text x="550" y="425" fill="#E2E8F0" font-size="19" font-weight="700">graphics + retained resources</text><text x="550" y="448" fill="#94A3B8" font-size="14">damage · text · atlas · mesh · layers</text>
    <path d="M550 464v24H330v26M550 488h220v26" fill="none" stroke="#6F86A8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="160" y="514" width="340" height="78" rx="20" fill="#12304A" stroke="#22D3EE" stroke-width="2"/><text x="330" y="550" fill="#E2E8F0" font-size="19" font-weight="700">WGPU renderer</text><text x="330" y="574" fill="#94A3B8" font-size="14">GPU · HDR · WebGL</text>
    <rect x="600" y="514" width="340" height="78" rx="20" fill="#2B214D" stroke="#8B5CF6" stroke-width="2"/><text x="770" y="550" fill="#E2E8F0" font-size="19" font-weight="700">Tiny Skia renderer</text><text x="770" y="574" fill="#94A3B8" font-size="14">CPU · headless · fallback</text>
    <path d="M330 592v46h440M770 592v46M550 638v36" fill="none" stroke="#6F86A8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="250" y="680" width="600" height="52" rx="18" fill="url(#accent)"/><text x="550" y="713" fill="#FFFFFF" font-size="19" font-weight="750">desktop · web · Vyom · headless</text>
  </g>
</svg>
